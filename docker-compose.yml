name: ${UCP_PROJECT:-bench-ucp-bridge}
# Copyright (c) 2026 Friends of Presta. Auteur : Christophe Vidal, pour le podcast Contrib. Licence AFL-3.0 (Academic Free License 3.0), voir LICENSE.
# Banc UCP n°3 : prototype ucpbridge (podcast Contrib.), port 8092.
# Ports et nom de projet réglables (banc parallèle, intégration continue) : UCP_PROJECT, UCP_PORT,
# STRIPE_MOCK_PORT, MAILPIT_PORT. Sans variable, valeurs historiques ci-dessous.
# Version de PrestaShop : PS_IMAGE (étiquette de l'image officielle prestashop/prestashop, défaut 9.1.5), par exemple
# PS_IMAGE=8.1.7 ou PS_IMAGE=8.2.8. Chaque image embarque sa propre version de PHP (8.1 pour PrestaShop 8, 8.5 pour 9.1).
# Changer de version sur un banc existant impose de repartir de volumes vides (docker compose down -v).
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: bench
      MYSQL_DATABASE: prestashop
    volumes:
      - db:/var/lib/mysql
  prestashop:
    image: prestashop/prestashop:${PS_IMAGE:-9.1.5}
    depends_on: [mysql]
    # Image 9.2.0 : le script de démarrage s'arrête en erreur juste après une installation réussie (dossier install/
    # déjà supprimé par l'installeur). Relancé, le conteneur trouve PrestaShop installé et démarre Apache.
    restart: on-failure:3
    environment:
      DB_SERVER: mysql
      DB_NAME: prestashop
      DB_USER: root
      DB_PASSWD: bench
      PS_INSTALL_AUTO: 1
      PS_DOMAIN: localhost:${UCP_PORT:-8092}
      PS_LANGUAGE: fr
      PS_COUNTRY: FR
      PS_DEV_MODE: 0
      ADMIN_MAIL: demo@contrib.test
      ADMIN_PASSWD: ContribBench2026
    ports:
      - "${UCP_PORT:-8092}:80"
    # Faux Stripe des tests (test_08) lancé sur l'hôte : nom déjà résolu par Docker Desktop, à déclarer sous Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ps:/var/www/html
  # Faux Stripe local (image officielle) : aucune vraie carte, aucun appel vers api.stripe.com.
  stripe-mock:
    image: stripe/stripe-mock:latest
    ports:
      - "${STRIPE_MOCK_PORT:-12111}:12111"
  # Capteur d'e-mails local : SMTP 1025 (réseau du banc), interface web http://localhost:8025. Rien ne sort.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
volumes:
  db:
  ps:
